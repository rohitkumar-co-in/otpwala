name: Supabase database backup

on:
  schedule:
    - cron: "30 20 * * *" # Daily at 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify repository privacy and backup secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')" != "true" ]]; then
            echo "::error::Database backups are only allowed in a private GitHub repository."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Add the SUPABASE_DB_URL Actions secret before running this workflow."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_DB_URL}"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Dump roles, schema, and data
        shell: bash
        run: |
          set -euo pipefail
          backup_tmp="$(mktemp -d)"
          trap 'rm -rf "$backup_tmp"' EXIT

          # Do not load the application's local Supabase config here. The CLI may
          # reject local-only settings (for example, [local_smtp]) even though
          # this job only connects to the hosted database. Use a minimal config
          # in an isolated workdir for the dump commands.
          cli_workdir="$backup_tmp/cli-project"
          mkdir -p "$cli_workdir/supabase"
          printf 'project_id = "otpwala-backup"\n' > "$cli_workdir/supabase/config.toml"
          cd "$cli_workdir"

          run_dump() {
            local label="$1"
            shift
            local log_file="$backup_tmp/${label}.log"
            local started_at status elapsed

            started_at="$(date +%s)"
            echo "::group::Dump ${label}"
            echo "Starting ${label} dump at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."

            set +e
            "$@" >"$log_file" 2>&1
            status=$?
            set -e

            elapsed=$(( $(date +%s) - started_at ))
            if [[ "$status" -eq 0 ]]; then
              sed -E 's#(postgres(ql)?://[^:/[:space:]]+):[^@[:space:]]+@#\1:[REDACTED]@#g' "$log_file"
              echo "${label} dump completed in ${elapsed}s."
            else
              echo "::error title=Database dump failed::${label} dump exited with status ${status} after ${elapsed}s."
              echo "Last 80 lines of captured output (connection passwords redacted):"
              tail -n 80 "$log_file" | sed -E 's#(postgres(ql)?://[^:/[:space:]]+):[^@[:space:]]+@#\1:[REDACTED]@#g'
              echo "::endgroup::"
              return "$status"
            fi
            echo "::endgroup::"
          }

          echo "Supabase CLI version: $(supabase --version)"
          run_dump roles supabase --workdir "$cli_workdir" db dump --db-url "$SUPABASE_DB_URL" --file "$backup_tmp/roles.sql" --role-only
          run_dump schema supabase --workdir "$cli_workdir" db dump --db-url "$SUPABASE_DB_URL" --file "$backup_tmp/schema.sql"
          run_dump data supabase --workdir "$cli_workdir" db dump --db-url "$SUPABASE_DB_URL" --file "$backup_tmp/data.sql" --data-only --use-copy --exclude storage.buckets_vectors --exclude storage.vector_indexes

          test -s "$backup_tmp/roles.sql"
          test -s "$backup_tmp/schema.sql"
          test -s "$backup_tmp/data.sql"

          # The dumps run from a temporary Supabase workdir. Return to the
          # checked-out repository before using its origin remote or git index.
          cd "$GITHUB_WORKSPACE"

          backup_dir="$backup_tmp/latest"
          mkdir -p "$backup_dir"
          for dump in roles schema data; do
            gzip -n -9 -c "$backup_tmp/$dump.sql" > "$backup_dir/$dump.sql.gz"
          done

          printf 'created_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$backup_dir/manifest.txt"
          (
            cd "$backup_dir"
            sha256sum roles.sql.gz schema.sql.gz data.sql.gz > SHA256SUMS
          )
          remote_sha=""
          remote_branch="$(git ls-remote --heads origin refs/heads/database-backups)"
          if [[ -n "$remote_branch" ]]; then
            remote_sha="${remote_branch%%$'\t'*}"
            git fetch origin +refs/heads/database-backups:refs/remotes/origin/database-backups
            backup_ref=refs/remotes/origin/database-backups
            unrelated_files="$(git ls-tree -r --name-only "$backup_ref" | grep -Ev '^backups/supabase/' || true)"

            if [[ -n "$unrelated_files" ]]; then
              echo "Converting database-backups to a database-only branch. Archiving prior snapshots first."
              archive_root="$backup_tmp/prior-snapshots"
              mkdir -p "$archive_root"

              while IFS= read -r commit; do
                manifest="$(git show "$commit:backups/supabase/latest/manifest.txt" 2>/dev/null || true)"
                created_at="$(printf '%s\n' "$manifest" | sed -n 's/^created_at_utc=//p' | head -n 1)"
                archive_id="$(printf '%s' "$created_at" | tr -cd '[:alnum:]')"
                if [[ -z "$archive_id" ]]; then
                  archive_id="legacy-${commit:0:8}"
                else
                  archive_id="${archive_id}-${commit:0:8}"
                fi

                snapshot_dir="$archive_root/$archive_id"
                mkdir -p "$snapshot_dir"
                for file in roles.sql.gz schema.sql.gz data.sql.gz manifest.txt SHA256SUMS; do
                  if git cat-file -e "$commit:backups/supabase/latest/$file" 2>/dev/null; then
                    git show "$commit:backups/supabase/latest/$file" > "$snapshot_dir/$file"
                  fi
                done
              done < <(git log --format='%H' "$backup_ref" -- backups/supabase/latest/manifest.txt)

              git switch --orphan database-backup-clean
              git rm -r -f --ignore-unmatch -- .
              if [[ -n "$(find "$archive_root" -type f -print -quit)" ]]; then
                mkdir -p backups/supabase/archive
                cp -R "$archive_root"/. backups/supabase/archive/
              fi
              rewrite_backup_branch=true
            else
              git checkout -B database-backups "$backup_ref"
              rewrite_backup_branch=false
            fi
          else
            git switch --orphan database-backup-clean
            git rm -r -f --ignore-unmatch -- .
            rewrite_backup_branch=true
          fi

          mkdir -p backups/supabase/latest
          cp "$backup_dir/roles.sql.gz" backups/supabase/latest/roles.sql.gz
          cp "$backup_dir/schema.sql.gz" backups/supabase/latest/schema.sql.gz
          cp "$backup_dir/data.sql.gz" backups/supabase/latest/data.sql.gz
          cp "$backup_dir/manifest.txt" backups/supabase/latest/manifest.txt
          cp "$backup_dir/SHA256SUMS" backups/supabase/latest/SHA256SUMS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/supabase
          if git diff --cached --quiet; then
            echo "The database dump has not changed; no backup commit is needed."
            exit 0
          fi
          git commit -m "chore(backup): refresh Supabase database dump"
          if [[ "$rewrite_backup_branch" == "true" ]]; then
            git push --force-with-lease="refs/heads/database-backups:$remote_sha" origin HEAD:database-backups
          else
            git push origin HEAD:database-backups
          fi
